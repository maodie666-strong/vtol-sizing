<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>垂直起降飞行器总体参数快速权衡工具</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --line: #e3e6ea;
    --line-strong: #cdd3da;
    --text: #1b1f24;
    --text-2: #5b6570;
    --text-3: #8b949e;
    --blue: #185fa5;
    --blue-2: #378add;
    --blue-bg: #e8f1fb;
    --purple: #534ab7;
    --teal: #1d9e75;
    --amber: #ba7517;
    --coral: #d85a30;
    --red: #a32d2d;
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 18px 26px 16px;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: .01em; }
  header .sub { margin: 5px 0 0; color: var(--text-2); font-size: 13px; }
  header .meta {
    margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    background: var(--blue-bg); color: var(--blue); white-space: nowrap;
  }
  .chip.gray { background: #eef0f3; color: var(--text-2); }

  main { display: flex; align-items: flex-start; gap: 18px; padding: 18px 26px 40px; }
  @media (max-width: 1080px) { main { flex-direction: column; } }

  aside {
    flex: 0 0 336px; width: 336px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 4px 16px 16px;
    position: sticky; top: 14px; max-height: calc(100vh - 28px); overflow-y: auto;
  }
  @media (max-width: 1080px) { aside { position: static; width: 100%; flex: none; } }

  .group { padding-top: 14px; }
  .group + .group { border-top: 1px solid var(--line); }
  .group h3 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--text-3);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .ctrl { margin-bottom: 13px; }
  .ctrl .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .ctrl .name { font-size: 13px; color: var(--text-2); }
  .ctrl .val { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--blue); }
  .ctrl .val .u { font-family: inherit; font-weight: 400; color: var(--text-3); font-size: 11.5px; margin-left: 2px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: var(--line-strong); border-radius: 2px; outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: var(--blue); cursor: pointer; border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--line-strong);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--blue);
    cursor: pointer; border: 2px solid #fff;
  }

  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; padding: 7px 13px; cursor: pointer;
    background: #fff; color: var(--text); border: 1px solid var(--line-strong);
    border-radius: 7px; transition: background .12s, border-color .12s;
  }
  button:hover { background: #f2f5f8; border-color: var(--blue-2); }
  button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.primary:hover { background: #14507f; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .presets button { font-size: 12px; padding: 5px 10px; }

  section.results { flex: 1 1 auto; min-width: 0; }

  .warn {
    background: #fdf3e7; border: 1px solid #f0d9b5; color: #7a4b0a;
    padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px;
  }
  .warn.err { background: #fdeceb; border-color: #f2c9c7; color: var(--red); }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 15px;
  }
  .card.hero { border-color: var(--blue-2); background: var(--blue-bg); }
  .card .k { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .card.hero .k { color: var(--blue); }
  .card .v { font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
  .card.hero .v { color: var(--blue); }
  .card .u { font-size: 12px; color: var(--text-3); font-weight: 400; margin-left: 3px; }
  .card .x { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

  .box {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 17px; margin-bottom: 16px;
  }
  .box h2 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
  .box .hint { margin: 0 0 13px; font-size: 12px; color: var(--text-3); }

  .stack { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .stack .seg { height: 100%; transition: width .18s ease; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; }
  .legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .legend .num { font-family: var(--mono); color: var(--text); font-weight: 600; }

  table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.kv td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  table.kv tr:last-child td { border-bottom: none; }
  table.kv td:first-child { color: var(--text-2); }
  table.kv td:last-child { text-align: right; font-family: var(--mono); font-weight: 600; }
  table.kv td .u { font-family: inherit; font-weight: 400; color: var(--text-3); font-size: 11.5px; margin-left: 3px; }

  .tornado .trow { display: grid; grid-template-columns: 118px 1fr 62px; align-items: center; gap: 10px; margin-bottom: 7px; }
  .tornado .tname { font-size: 12px; color: var(--text-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tornado .ttrack { height: 15px; background: #f0f2f5; border-radius: 3px; position: relative; }
  .tornado .tbar { height: 100%; border-radius: 3px; transition: width .18s ease; }
  .tornado .tval { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); }

  .chart { width: 100%; display: block; }
  .chart text { font-family: var(--mono); }
  .tip { font-size: 12px; color: var(--text-3); margin-top: 8px; }

  footer { padding: 0 26px 34px; color: var(--text-3); font-size: 12px; }
  footer code { font-family: var(--mono); background: #eef0f3; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <h1>垂直起降飞行器总体参数快速权衡工具</h1>
  <p class="sub">概念设计阶段：给定任务剖面，求解满足要求的最小起飞重量，并给出重量构成、功率需求、能量分配与参数敏感性排序</p>
  <div class="meta">
    <span class="chip">零第三方依赖</span>
    <span class="chip">动量理论 + 品质因数</span>
    <span class="chip">重量—能量闭合迭代</span>
    <span class="chip gray" id="solverInfo">—</span>
  </div>
</header>

<main>
  <aside>
    <div class="group">
      <h3>预置方案</h3>
      <div class="presets" id="presets"></div>
    </div>
    <div id="panel"></div>
    <div class="actions">
      <button class="primary" id="btnReset">恢复默认</button>
      <button id="btnExport">导出结果 CSV</button>
    </div>
  </aside>

  <section class="results" id="results"></section>
</main>

<footer>
  物理模型与 <code>vtol_sizing/</code> 下的 Python 内核同源，已通过 63 项跨语言数值一致性验证（容差 1e-9）。
  本页为概念设计阶段的一阶估算工具，用于方案比较与趋势判断，不能替代详细设计。
</footer>

<script src="vtol-web/model.js"></script>
<script src="vtol-web/surrogate-data.js"></script>
<script src="vtol-web/surrogate.js"></script>
<script>
'use strict';

/* ============================================================ 控件定义 */
var GROUPS = [
  { title: '旋翼系统', controls: [
    { k: 'nRotor',               label: '旋翼数量',      min: 2,    max: 12,   step: 1,    unit: '个',  d: 0 },
    { k: 'rotorRadius',          label: '桨半径',        min: 0.3,  max: 1.8,  step: 0.01, unit: 'm',   d: 2 },
    { k: 'fm',                   label: '品质因数 FM',   min: 0.5,  max: 0.85, step: 0.01, unit: '',    d: 2 },
    { k: 'etaMotor',             label: '电机效率',      min: 0.7,  max: 0.97, step: 0.01, unit: '',    d: 2 },
    { k: 'etaTransmission',      label: '传动效率',      min: 0.85, max: 1.0,  step: 0.01, unit: '',    d: 2 }
  ]},
  { title: '机翼', controls: [
    { k: 'wingArea',             label: '机翼参考面积',  min: 1,    max: 20,   step: 0.1,  unit: 'm²',  d: 1 },
    { k: 'aspectRatio',          label: '展弦比',        min: 4,    max: 14,   step: 0.1,  unit: '',    d: 1 },
    { k: 'cd0',                  label: '零升阻力系数',  min: 0.015, max: 0.06, step: 0.001, unit: '',  d: 3 },
    { k: 'oswaldE',              label: '奥斯瓦尔德因子', min: 0.6,  max: 0.95, step: 0.01, unit: '',    d: 2 }
  ]},
  { title: '重量估算', controls: [
    { k: 'structureFraction',    label: '结构重量系数',  min: 0.18, max: 0.42, step: 0.01, unit: '',    d: 2 },
    { k: 'payloadMass',          label: '有效载荷',      min: 0,    max: 400,  step: 5,    unit: 'kg',  d: 0 },
    { k: 'avionicsMass',         label: '航电与系统',    min: 5,    max: 80,   step: 1,    unit: 'kg',  d: 0 },
    { k: 'motorSpecificPower',   label: '电机功率密度',  min: 2000, max: 9000, step: 100,  unit: 'W/kg', d: 0 },
    { k: 'rotorSpecificThrust',  label: '旋翼推力密度',  min: 120,  max: 400,  step: 5,    unit: 'N/kg', d: 0 }
  ]},
  { title: '电池', controls: [
    { k: 'batterySpecificEnergy', label: '系统比能量',   min: 150,  max: 450,  step: 5,    unit: 'Wh/kg', d: 0 },
    { k: 'batteryUsableFraction', label: '可用放电深度', min: 0.6,  max: 0.95, step: 0.01, unit: '',    d: 2 }
  ]},
  { title: '任务剖面', controls: [
    { k: 'rangeKm',              label: '任务航程',      min: 10,   max: 300,  step: 5,    unit: 'km',  d: 0 },
    { k: 'cruiseSpeed',          label: '巡航速度',      min: 25,   max: 90,   step: 1,    unit: 'm/s', d: 0 },
    { k: 'hoverTimeS',           label: '悬停总时间',    min: 20,   max: 300,  step: 5,    unit: 's',   d: 0 },
    { k: 'climbAltitude',        label: '爬升高度',      min: 50,   max: 1000, step: 25,   unit: 'm',   d: 0 },
    { k: 'reserveFraction',      label: '能量储备系数',  min: 0,    max: 0.4,  step: 0.01, unit: '',    d: 2 }
  ]}
];

var PRESETS = [
  { name: '小型物流机', patch: {
      nRotor: 4, rotorRadius: 0.55, wingArea: 1.4, aspectRatio: 7.0,
      payloadMass: 20, avionicsMass: 8, rangeKm: 30, cruiseSpeed: 32,
      hoverTimeS: 40, climbAltitude: 150, batterySpecificEnergy: 240,
      structureFraction: 0.30, fm: 0.68 }},
  { name: '中型载货 eVTOL', patch: {
      nRotor: 8, rotorRadius: 0.90, wingArea: 6.0, aspectRatio: 8.0,
      payloadMass: 200, avionicsMass: 25, rangeKm: 100, cruiseSpeed: 55,
      hoverTimeS: 60, climbAltitude: 300, batterySpecificEnergy: 250,
      structureFraction: 0.30, fm: 0.72 }},
  { name: '载人 eVTOL', patch: {
      nRotor: 8, rotorRadius: 1.30, wingArea: 10.0, aspectRatio: 9.0,
      payloadMass: 360, avionicsMass: 45, rangeKm: 160, cruiseSpeed: 65,
      hoverTimeS: 90, climbAltitude: 450, batterySpecificEnergy: 290,
      structureFraction: 0.27, fm: 0.76 }}
];

var COLORS = {
  structure: '#378add',
  propulsion: '#534ab7',
  rotor: '#1d9e75',
  avionics: '#ba7517',
  payload: '#8b949e',
  battery: '#185fa5'
};
var MASS_LABELS = {
  structure: '结构', propulsion: '动力系统', rotor: '旋翼系统',
  avionics: '航电系统', payload: '有效载荷', battery: '电池'
};
var ENERGY_COLORS = { hover: '#ba7517', climb: '#d85a30', cruise: '#185fa5' };
var ENERGY_LABELS = { hover: '悬停段', climb: '爬升段', cruise: '巡航段' };

var cfg = VTOL.defaultConfig();
var inputs = {};
var rafId = null;

/* ============================================================ 数值格式 */
function fmt(v, d) {
  if (!isFinite(v)) return '—';
  return v.toFixed(d === undefined ? 1 : d);
}
function num(v, d) {
  var s = fmt(v, d);
  var p = s.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return p.join('.');
}

/* ============================================================ 构建控件 */
function buildPanel() {
  var host = document.getElementById('panel');
  var html = '';
  GROUPS.forEach(function (g) {
    html += '<div class="group"><h3>' + g.title + '</h3>';
    g.controls.forEach(function (c) {
      html +=
        '<div class="ctrl">' +
          '<div class="row">' +
            '<span class="name">' + c.label + '</span>' +
            '<span class="val" id="val-' + c.k + '">—</span>' +
          '</div>' +
          '<input type="range" id="in-' + c.k + '" min="' + c.min + '" max="' + c.max +
                 '" step="' + c.step + '" value="' + cfg[c.k] + '">' +
        '</div>';
    });
    html += '</div>';
  });
  host.innerHTML = html;

  GROUPS.forEach(function (g) {
    g.controls.forEach(function (c) {
      var el = document.getElementById('in-' + c.k);
      inputs[c.k] = { el: el, def: c };
      el.addEventListener('input', function () {
        cfg[c.k] = parseFloat(el.value);
        scheduleUpdate();
      });
      el.addEventListener('change', function () { cfg[c.k] = parseFloat(el.value); update(); });
    });
  });
  syncControls();
}

function syncControls() {
  GROUPS.forEach(function (g) {
    g.controls.forEach(function (c) {
      var v = cfg[c.k];
      var el = document.getElementById('in-' + c.k);
      if (el) el.value = v;
      var lab = document.getElementById('val-' + c.k);
      if (lab) lab.innerHTML = fmt(v, c.d) + (c.unit ? '<span class="u">' + c.unit + '</span>' : '');
    });
  });
}

function buildPresets() {
  var host = document.getElementById('presets');
  host.innerHTML = PRESETS.map(function (p, i) {
    return '<button data-preset="' + i + '">' + p.name + '</button>';
  }).join('');
  host.addEventListener('click', function (e) {
    var idx = e.target.getAttribute && e.target.getAttribute('data-preset');
    if (idx === null || idx === undefined) return;
    var patch = PRESETS[parseInt(idx, 10)].patch;
    cfg = VTOL.withParams(VTOL.defaultConfig(), patch);
    syncControls();
    update();
  });
}

function scheduleUpdate() {
  if (rafId !== null) return;
  rafId = requestAnimationFrame(function () { rafId = null; update(); });
}

/* ============================================================ 堆叠条 */
function stackedBar(segments, colors, labels, total, unit) {
  var bar = '<div class="stack">';
  segments.forEach(function (s) {
    var pct = total > 0 ? (s.v / total) * 100 : 0;
    bar += '<div class="seg" style="width:' + pct.toFixed(3) + '%;background:' + colors[s.k] + '"></div>';
  });
  bar += '</div><div class="legend">';
  segments.forEach(function (s) {
    var pct = total > 0 ? (s.v / total) * 100 : 0;
    bar += '<span class="item"><span class="sw" style="background:' + colors[s.k] + '"></span>' +
           labels[s.k] + ' <span class="num">' + num(s.v, 1) + unit + '</span>' +
           ' <span style="color:var(--text-3)">' + fmt(pct, 1) + '%</span></span>';
  });
  bar += '</div>';
  return bar;
}

/* ============================================================ 折线图 */
function lineChart(points, opts) {
  opts = opts || {};
  var W = 680, H = 250;
  var PL = 62, PR = 18, PT = 16, PB = 38;
  var iw = W - PL - PR, ih = H - PT - PB;
  if (!points.length) return '';

  var xs = points.map(function (p) { return p.x; });
  var ys = points.map(function (p) { return p.y; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var pad = (y1 - y0) * 0.12 || 1;
  y0 -= pad; y1 += pad;

  function sx(v) { return PL + (v - x0) / (x1 - x0 || 1) * iw; }
  function sy(v) { return PT + ih - (v - y0) / (y1 - y0 || 1) * ih; }

  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  s += '<title>' + (opts.title || '参数扫描曲线') + '</title>';

  // 横向网格与 y 轴刻度
  for (var i = 0; i <= 4; i++) {
    var yv = y0 + (y1 - y0) * i / 4;
    var py = sy(yv);
    s += '<line x1="' + PL + '" y1="' + py.toFixed(1) + '" x2="' + (W - PR) + '" y2="' + py.toFixed(1) +
         '" stroke="#eef0f3" stroke-width="1"/>';
    s += '<text x="' + (PL - 8) + '" y="' + (py + 4).toFixed(1) + '" font-size="11" fill="#8b949e" text-anchor="end">' +
         fmt(yv, opts.yDecimals === undefined ? 0 : opts.yDecimals) + '</text>';
  }

  // x 轴刻度
  for (var j = 0; j <= 4; j++) {
    var xv = x0 + (x1 - x0) * j / 4;
    s += '<text x="' + sx(xv).toFixed(1) + '" y="' + (H - PB + 18) + '" font-size="11" fill="#8b949e" text-anchor="middle">' +
         fmt(xv, opts.xDecimals === undefined ? 2 : opts.xDecimals) + '</text>';
  }

  // 坐标轴
  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +
       '" stroke="#cdd3da" stroke-width="1"/>';
  s += '<line x1="' + PL + '" y1="' + PT + '" x2="' + PL + '" y2="' + (PT + ih) +
       '" stroke="#cdd3da" stroke-width="1"/>';

  // 轴标签
  s += '<text x="' + (W - PR) + '" y="' + (H - 4) + '" font-size="11" fill="#5b6570" text-anchor="end">' +
       (opts.xLabel || '') + '</text>';
  s += '<text x="' + 6 + '" y="' + (PT + 11) + '" font-size="11" fill="#5b6570">' + (opts.yLabel || '') + '</text>';

  // 曲线
  var d = points.map(function (p, i) {
    return (i === 0 ? 'M' : 'L') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1);
  }).join(' ');
  s += '<path d="' + d + '" fill="none" stroke="#185fa5" stroke-width="2" stroke-linejoin="round"/>';

  // 当前工作点
  if (opts.marker) {
    var mx = sx(opts.marker.x), my = sy(opts.marker.y);
    s += '<line x1="' + mx.toFixed(1) + '" y1="' + PT + '" x2="' + mx.toFixed(1) + '" y2="' + (PT + ih) +
         '" stroke="#d85a30" stroke-width="1" stroke-dasharray="4 3"/>';
    s += '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="4.5" fill="#d85a30" stroke="#fff" stroke-width="2"/>';
    s += '<text x="' + (mx + 9).toFixed(1) + '" y="' + (my - 8).toFixed(1) + '" font-size="11.5" fill="#d85a30" font-weight="600">' +
         opts.marker.label + '</text>';
  }
  s += '</svg>';
  return s;
}

/* ============================================================ 主渲染 */
function update() {
  var res = VTOL.size(cfg);
  var sens = VTOL.sensitivity(cfg, 0.10);

  document.getElementById('solverInfo').textContent =
    res.converged ? ('重量闭合已收敛 · ' + res.iterations + ' 次迭代')
                  : ('未收敛 · ' + res.iterations + ' 次迭代');

  var html = '';

  if (res.warning) {
    html += '<div class="warn' + (res.converged ? '' : ' err') + '">' + res.warning + '</div>';
  }

  // ---- 关键指标卡片
  var total = res.mtow;
  var hoverEnd = (res.massBreakdown.battery * cfg.batterySpecificEnergy * cfg.batteryUsableFraction)
               * 3600 / res.hoverPower / 60;
  html += '<div class="cards">' +
    card('起飞重量 MTOW', num(total, 1), 'kg', '结构 + 动力 + 旋翼 + 航电 + 载荷 + 电池', true) +
    card('电池重量', num(res.massBreakdown.battery, 1), 'kg',
         '占起飞重量 ' + fmt(res.massBreakdown.battery / total * 100, 1) + '%') +
    card('装机功率', num(res.installedPower / 1000, 1), 'kW',
         '峰值 ' + num(res.maxShaftPower / 1000, 1) + ' kW × 裕度 ' + fmt(cfg.powerMargin, 2)) +
    card('巡航升阻比', num(res.liftToDrag, 2), '',
         '巡航升力系数 ' + fmt(res.clCruise, 3)) +
    card('纯悬停航时', num(hoverEnd, 1), 'min', '仅悬停，不含巡航段') +
    '</div>';

  // ---- 重量构成
  var massSeg = Object.keys(MASS_LABELS).map(function (k) {
    return { k: k, v: res.massBreakdown[k] };
  });
  html += '<div class="box"><h2>重量构成</h2>' +
    '<p class="hint">电池重量由任务能量需求反推，是重量闭合的驱动量</p>' +
    stackedBar(massSeg, COLORS, MASS_LABELS, total, ' kg') + '</div>';

  // ---- 能量分配
  var eTotal = res.energyBreakdown.hover + res.energyBreakdown.climb + res.energyBreakdown.cruise;
  var eSeg = ['hover', 'climb', 'cruise'].map(function (k) {
    return { k: k, v: res.energyBreakdown[k] / 1000 };
  });
  html += '<div class="box"><h2>能量分配</h2>' +
    '<p class="hint">任务消耗 ' + num(eTotal / 1000, 2) + ' kWh，含 ' + fmt(cfg.reserveFraction * 100, 0) +
    '% 储备后需装机 ' + num(res.requiredEnergy / 1000, 2) + ' kWh</p>' +
    stackedBar(eSeg, ENERGY_COLORS, ENERGY_LABELS, eTotal / 1000, ' kWh') + '</div>';

  // ---- 关键参数
  var tb = res.timeBreakdown;
  html += '<div class="box"><h2>关键参数</h2><p class="hint">用于判断方案是否落在工程可行区间</p>' +
    '<table class="kv">' +
    row('翼载（W/S）', num(res.wingLoading, 1), 'N/m²') +
    row('桨盘载荷', num(res.diskLoading, 1), 'N/m²') +
    row('桨盘总面积', num(cfg.nRotor * Math.PI * cfg.rotorRadius * cfg.rotorRadius, 2), 'm²') +
    row('悬停电功率', num(res.hoverPower / 1000, 2), 'kW') +
    row('爬升电功率', num(res.climbPower / 1000, 2), 'kW') +
    row('巡航电功率', num(res.cruisePower / 1000, 2), 'kW') +
    row('诱导阻力占比', fmt(res.inducedRatio * 100, 1), '%') +
    row('巡航段时长', num(tb.cruise / 60, 1), 'min') +
    row('爬升段时长', num(tb.climb, 0), 's') +
    row('单位载荷航程代价', num(res.requiredEnergy / Math.max(cfg.payloadMass, 0.001), 1), 'Wh/kg') +
    row('结构功重比', num(total / (res.installedPower / 1000), 2), 'kg/kW') +
    '</table></div>';

  // ---- 代理模型对比
  html += surrogateBox(res);

  // ---- 敏感性
  var top = sens.slice(0, 9);
  var maxSwing = top.length ? top[0].swingPct : 1;
  html += '<div class="box tornado"><h2>参数敏感性</h2>' +
    '<p class="hint">每个参数施加 ±10% 扰动，观察起飞重量的相对变化 —— 这是"该优先优化什么"的答案</p>';
  top.forEach(function (s) {
    var w = Math.max(maxSwing > 0 ? (s.swingPct / maxSwing) * 100 : 0, 2);
    var col = s.direction === '+1' ? '#d85a30' : (s.direction === '-1' ? '#378add' : '#8b949e');
    var mark = s.direction === '+1' ? '↑' : (s.direction === '-1' ? '↓' : '·');
    html += '<div class="trow">' +
      '<span class="tname" title="' + s.label + '">' + s.label + '</span>' +
      '<div class="ttrack"><div class="tbar" style="width:' + w.toFixed(1) + '%;background:' + col + '"></div></div>' +
      '<span class="tval">' + fmt(s.swingPct, 2) + '% ' + mark + '</span>' +
      '</div>';
  });
  html += '<p class="tip">↑ 表示该参数增大使起飞重量上升；↓ 表示下降。当前最敏感参数：' +
    (top[0] ? top[0].label + '（' + fmt(top[0].swingPct, 2) + '%）' : '—') + '</p></div>';

  // ---- 桨半径扫描
  var r0 = Math.max(cfg.rotorRadius * 0.55, 0.15);
  var r1 = cfg.rotorRadius * 1.55;
  var radii = VTOL.linspace(r0, r1, 21);
  var scan = VTOL.sweep1d(cfg, 'rotorRadius', radii);
  var pts = scan.filter(function (s) { return s.converged && isFinite(s.mtow); })
                 .map(function (s) { return { x: s.value, y: s.mtow }; });
  var best = null;
  if (pts.length) {
    best = pts.reduce(function (a, b) { return b.y < a.y ? b : a; });
  }
  html += '<div class="box"><h2>桨半径扫描</h2>' +
    '<p class="hint">桨盘越大悬停越省功率，但旋翼系统与机翼的代价也在变 —— 这条曲线就是总体设计里的取舍</p>' +
    lineChart(pts, {
      xLabel: '桨半径 (m)', yLabel: 'MTOW (kg)',
      title: '起飞重量随桨半径的变化',
      marker: { x: cfg.rotorRadius, y: res.mtow, label: '当前 ' + fmt(res.mtow, 0) + ' kg' }
    }) +
    (best ? '<p class="tip">扫描区间内最优桨半径约 <b>' + fmt(best.x, 2) +
            ' m</b>（MTOW ' + num(best.y, 1) + ' kg）；当前设置 ' + fmt(cfg.rotorRadius, 2) +
            ' m，与之相差 ' + fmt(best.y - res.mtow, 1) + ' kg。</p>' : '') +
    '</div>';

  document.getElementById('results').innerHTML = html;

  // 基准测试按钮在结果区内部，每次重渲染都会重建，所以在这里重新绑定
  var benchBtn = document.getElementById('btnBench');
  if (benchBtn) benchBtn.addEventListener('click', runBenchmark);
}

/* ============================================================ 代理模型面板 */

var SURROGATE = null;
try {
  SURROGATE = VTOL_SURROGATE.fromGlobal('VTOL_SURROGATE_DATA');
} catch (err) {
  SURROGATE = null;
}

// 代理模型的输出量 -> 精确求解结果里的对应值（以及单位）
var SURROGATE_MAP = [
  { key: 'mtow',            label: '起飞重量',   unit: 'kg',  decimals: 1,
    exact: function (r) { return r.mtow; } },
  { key: 'battery_mass',    label: '电池重量',   unit: 'kg',  decimals: 1,
    exact: function (r) { return r.massBreakdown.battery; } },
  { key: 'hover_power',     label: '悬停功率',   unit: 'kW',  decimals: 2,
    exact: function (r) { return r.hoverPower / 1000; } },
  { key: 'installed_power', label: '装机功率',   unit: 'kW',  decimals: 2,
    exact: function (r) { return r.installedPower / 1000; } },
  { key: 'required_energy', label: '需装机能量', unit: 'kWh', decimals: 2,
    exact: function (r) { return r.requiredEnergy / 1000; } },
  { key: 'lift_to_drag',    label: '巡航升阻比', unit: '',    decimals: 2,
    exact: function (r) { return r.liftToDrag; } }
];

function surrogateBox(res) {
  if (!SURROGATE) {
    return '<div class="box"><h2>代理模型</h2>' +
      '<p class="hint">未加载代理模型权重（缺少 vtol-web/surrogate-data.js）。</p></div>';
  }

  var x = SURROGATE.configToVector(cfg);
  var oob = SURROGATE.outOfRange(x);

  // 推理一次，并按输出名建立索引
  var vec = SURROGATE.predictVector(x);
  var names = SURROGATE.outputNames;
  var pred = {};
  for (var n = 0; n < names.length; n++) pred[names[n]] = vec[n];

  // 实测代理模型单次推理耗时
  var t0 = performance.now();
  var REPS = 200;
  for (var i = 0; i < REPS; i++) SURROGATE.predictVector(x);
  var surrogateUs = ((performance.now() - t0) / REPS) * 1000.0;

  var m = SURROGATE.metrics();

  var html = '<div class="box"><h2>代理模型 · 神经网络</h2>' +
    '<p class="hint">用训练好的多层感知机替代精确求解器。下表把两者放在一起，' +
    '标出每次预测的偏差 —— 代理模型的平均误差约 ' +
    fmt(m.mape_pct.reduce(function (a, b) { return a + b; }, 0) / m.mape_pct.length, 1) +
    '%，但单次推理快两个数量级。</p>';

  if (oob.length) {
    html += '<div class="warn">当前有参数超出代理模型的训练区间：' +
      oob.join('、') + '。此处预测不可信，请缩小该参数或使用精确求解。</div>';
  }

  html += '<table class="kv">' +
    '<tr><td style="color:var(--text-3);font-size:12px">输出量</td>' +
    '<td style="color:var(--text-3);font-size:12px">精确求解</td>' +
    '<td style="color:var(--text-3);font-size:12px">代理模型</td>' +
    '<td style="color:var(--text-3);font-size:12px">偏差</td></tr>';

  SURROGATE_MAP.forEach(function (item) {
    var ex = item.exact(res);
    var pr = pred[item.key];
    var errPct = (ex !== 0) ? Math.abs(pr - ex) / Math.abs(ex) * 100 : 0;
    var color = errPct < 2 ? 'var(--teal)'
              : (errPct < 5 ? 'var(--amber)' : 'var(--coral)');
    html += '<tr><td>' + item.label + '</td>' +
      '<td>' + num(ex, item.decimals) + unitSpan(item.unit) + '</td>' +
      '<td>' + num(pr, item.decimals) + unitSpan(item.unit) + '</td>' +
      '<td><span style="color:' + color + '">' + fmt(errPct, 2) + '%</span></td></tr>';
  });
  html += '</table>';

  html += '<p class="tip">训练集规模 ' + num(SURROGATE.meta.n_samples, 0) +
    ' 组，网络结构 ' + SURROGATE.meta.layer_sizes.join(' — ') +
    '，可训练参数 ' + num(SURROGATE.meta.n_parameters, 0) + ' 个；' +
    '测试集平均 R² = ' + fmt(m.mean_r2, 4) + '。' +
    '本环境实测单次推理 ' + fmt(surrogateUs, 1) + ' μs。</p>';

  // 这里刻意不把「本环境推理耗时」除以「训练时记录的求解耗时」得到加速比：
  // 前者测于本页面的 JavaScript，后者测于训练脚本的 Python，
  // 两个不同语言/运行时的数字相除没有意义。要比较就必须在同一环境下测。
  html += '<p class="tip">训练时在 Python 端记录的单次求解耗时约 ' +
    fmt(SURROGATE.meta.exact_ms_per_call * 1000, 1) + ' μs —— 该数字与本页的 ' +
    'JavaScript 实现不可直接相比。点击下方按钮，可在同一环境下实测两者的真实差距。</p>';

  html += '<div class="actions" style="margin-top:10px">' +
    '<button id="btnBench">跑一次大规模参数扫描，实测加速</button></div>' +
    '<div id="benchResult"></div>';

  html += '</div>';
  return html;
}

function unitSpan(u) {
  return u ? '<span class="u">' + u + '</span>' : '';
}

/**
 * 大规模扫描基准测试：同一批参数，分别用精确求解和代理模型各跑一遍。
 *
 * 关于预热 —— 这是基准测试里最容易出错、也最容易被误读的地方。
 * JS 引擎（V8）先解释执行，函数被反复调用后才由 TurboFan 编译成机器码，
 * 速度能差一个数量级。如果只给其中一方充分的预热，测出来的"加速比"其实
 * 衡量的是「热代码 vs 冷代码」，而不是两种方法的真实差距。
 * 因此这里对两边做等量的预热，再开始计时。
 */
function runBenchmark() {
  var host = document.getElementById('benchResult');
  if (!host || !SURROGATE) return;

  var N = 3000;
  var WARM = 2000;         // 等量预热次数，不计入结果
  host.innerHTML = '<p class="tip">正在预热并跑 ' + num(N, 0) +
    ' 组参数，请稍候（这一步若换成 CFD，在真实工程里是几小时）…</p>';

  setTimeout(function () {
    var rng = mulberry32(20260930);
    var xs = [];
    for (var i = 0; i < N; i++) {
      var c = VTOL.defaultConfig();
      c.rotorRadius = 0.5 + rng() * (1.5 - 0.5);
      c.nRotor = Math.round(4 + rng() * 6);
      c.fm = 0.58 + rng() * (0.82 - 0.58);
      c.etaMotor = 0.78 + rng() * (0.95 - 0.78);
      c.wingArea = 2 + rng() * 10;
      c.aspectRatio = 5 + rng() * 7;
      c.structureFraction = 0.22 + rng() * 0.16;
      c.batterySpecificEnergy = 200 + rng() * 180;
      c.cruiseSpeed = 35 + rng() * 40;
      c.rangeKm = 30 + rng() * 170;
      xs.push(c);
    }
    var vecs = xs.map(function (cc) { return SURROGATE.configToVector(cc); });

    // ---- 等量预热：两边都先把 JIT 喂热，否则比的是冷热而不是快慢 ----
    for (var w = 0; w < WARM; w++) {
      VTOL.size(xs[w % N]);
      SURROGATE.predictVector(vecs[w % N]);
    }

    var t0 = performance.now();
    for (var k = 0; k < N; k++) VTOL.size(xs[k]);
    var exactMs = performance.now() - t0;

    var t1 = performance.now();
    for (var j = 0; j < N; j++) SURROGATE.predictVector(vecs[j]);
    var surroMs = performance.now() - t1;

    // 更严格的口径：把「配置对象 -> 输入向量」的适配开销也算进去
    var t2 = performance.now();
    for (var m = 0; m < N; m++) SURROGATE.predictVector(SURROGATE.configToVector(xs[m]));
    var surroFullMs = performance.now() - t2;

    var exactUs = exactMs * 1000 / N;
    var surroUs = surroMs * 1000 / N;
    var surroFullUs = surroFullMs * 1000 / N;

    // 若代理模型确实更快则显示加速，否则如实说明它在本项目里并无优势
    var ratio = exactMs / Math.max(surroMs, 1e-9);
    var verdict = ratio >= 1.05
      ? '<tr><td><b>实测加速比</b></td><td style="color:var(--teal)">' +
        num(ratio, 1) + '×</td></tr>'
      : '<tr><td><b>实测加速比</b></td><td style="color:var(--coral)">' +
        num(1 / Math.max(ratio, 1e-9), 2) + '× 慢于精确求解</td></tr>';

    host.innerHTML =
      '<table class="kv">' +
        '<tr><td style="color:var(--text-3);font-size:12px">' + num(N, 0) +
          ' 组参数</td><td style="color:var(--text-3);font-size:12px">总计</td>' +
          '<td style="color:var(--text-3);font-size:12px">单次</td></tr>' +
        '<tr><td>精确求解</td><td>' + exactMs.toFixed(1) + '<span class="u">ms</span></td>' +
          '<td>' + fmt(exactUs, 2) + '<span class="u">μs</span></td></tr>' +
        '<tr><td>代理模型（含入参转换）</td><td>' + surroFullMs.toFixed(1) + '<span class="u">ms</span></td>' +
          '<td>' + fmt(surroFullUs, 2) + '<span class="u">μs</span></td></tr>' +
        verdict +
      '</table>' +
      '<p class="tip"><b>这个结果需要正确解读。</b>' +
      '本项目的精确求解器是自研的解析模型（动量理论 + 升力线 + 重量闭合），' +
      '单次只要几微秒 —— 在浏览器里它已经足够便宜，神经网络反而因为要算 ' +
      num(SURROGATE.meta.n_parameters, 0) + ' 次乘加而不占优势。' +
      '这正是做代理模型前必须先算清的一笔账：<b>如果精确模型本身很便宜，就根本不需要代理模型。</b></p>' +
      '<p class="tip">代理模型的加速价值出现在精确求解器昂贵的场合。' +
      '若把底层换成 CFD —— 工程上单次绕流求解通常要 10 ~ 60 分钟 —— ' +
      '同样这个微秒级的网络推理就能带来 <b>' +
      num(30 * 60 * 1e6 / surroFullUs, 0) + ' 倍</b>以上的加速，' +
      '原本需要算一个月的参数扫描，几秒钟就能出结果。' +
      '本项目用便宜的解析模型做数据源，是为了让整套「采样 → 训练 → 部署 → 校验」' +
      '的流程可以完全复现；换成 CFD 只需替换数据生成环节，其余代码不用改。</p>';
  }, 30);
}

/** 小巧的可复现随机数（mulberry32），避免依赖外部库。 */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function card(k, v, u, x, hero) {
  return '<div class="card' + (hero ? ' hero' : '') + '">' +
    '<div class="k">' + k + '</div>' +
    '<div class="v">' + v + (u ? '<span class="u">' + u + '</span>' : '') + '</div>' +
    '<div class="x">' + x + '</div></div>';
}

function row(k, v, u) {
  return '<tr><td>' + k + '</td><td>' + v + (u ? '<span class="u">' + u + '</span>' : '') + '</td></tr>';
}

  lines.push('敏感性排行（±10% 扰动对 MTOW 的影响）,参数,变化幅度 %,方向');
  VTOL.sensitivity(cfg, 0.10).forEach(function (s, i) {
    lines.push((i + 1) + ',' + s.label + ',' + s.swingPct.toFixed(3) + ',' +
      (s.direction === '+1' ? '增大' : s.direction === '-1' ? '减小' : '—'));
  });

  var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vtol_sizing_result.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ============================================================ 初始化 */
document.getElementById('btnReset').addEventListener('click', function () {
  cfg = VTOL.defaultConfig();
  syncControls();
  update();
});
document.getElementById('btnExport').addEventListener('click', exportCSV);

buildPresets();
buildPanel();
update();

// 供控制台调试
window.VTOL_APP = { getConfig: function () { return cfg; }, model: VTOL };
</script>
